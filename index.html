<style>
/* 共通の色と寸法。端末の表示設定に合わせて切り替える。 */

}

    --c-line: #303743; --c-ink: #f0f2f6; --c-ink-weak: #a5afbf;
    --c-soft: #282f3c; --c-navy: #d7e3fa; --c-navy-soft: #354d75;
    --c-primary: #b9ccef; --c-primary-deep: #d4e0f7; --on-primary: #16233d;
    --c-ok: #8acba2; --c-ng: #ffaaa0; --shadow: 0 2px 12px rgba(0,0,0,.12); }
}
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ブランド帯と画面見出しを上部に残す。 */
.appbar { position: fixed; inset: 0 0 auto; z-index: 50; height: var(--top-height); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); background: var(--c-card); }

/* 主要操作は親指が届く下部に固定する。 */
.bottom-actions { position: fixed; bottom: 0; left: 0; right: 0; z-index: 45; width: 100%; max-width: 600px; margin: auto; padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); background: var(--c-card); box-shadow: 0 -1px 0 var(--c-line); }

.thumb__placeholder { display: grid; place-items: center; height: 100%; color: var(--c-ok); }

/* 撮影処理が参照する要素の親子関係は変えずに配置する。 */
.screen[data-screen="shoot"] { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.shoot__stage { position: relative; width: 100%; aspect-ratio: 3/4; max-height: 55dvh; background: var(--c-stage); border-radius: var(--radius); overflow: hidden; }

.shoot-primary, .shoot__shutter { position: fixed; z-index: 46; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); width: auto; max-width: 560px; margin: auto; box-shadow: 0 0 0 12px var(--c-bg); }
.spots__viewer, .device-picker { position: fixed; inset: 0; z-index: 150; display: flex; align-items: flex-start; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--scrim); backdrop-filter: blur(5px); overflow-y: auto; }
.spots__viewer-card, .device-picker__card { width: 100%; max-width: 440px; background: var(--c-card); border-radius: 20px; padding: 24px 20px; box-shadow: var(--shadow); }
.device-picker { z-index: 200; align-items: center; }
.device-picker__card { max-height: 100%; overflow-y: auto; }
.device-picker__card p, .spots__viewer-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.spots__figure { margin-bottom: 16px; }

.spinner { width: 22px; height: 22px; border: 2px solid var(--c-line); border-top-color: var(--c-primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* 認証待ちと送信履歴。既存の色・カード部品を使う。 */
.auth-bar { position: fixed; top: var(--top-height); left: 12px; right: 12px; z-index: 80; display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--c-card); color: var(--c-ink); border: 1px solid var(--c-line); border-radius: var(--radius); box-shadow: var(--shadow); }
.auth-bar .btn { width: auto; flex-shrink: 0; margin: 0; min-height: 56px; }

<!-- __SCRIPT__ ← ビルド時に結合済みJSがここに入る -->
<script type="module">
const __npu_config = (() => {

// config.js — 設定値の唯一の置き場（担当：Claude）
// 秘密情報はクライアントIDのみ（公開前提の値）。他の秘密は絶対に書かない。

const CONFIG = {
  // Google Cloud で作った OAuth クライアントID をここに貼る（READMEの手順3）
  CLIENT_ID: "1049961337664-8g46qfb3a5oq8irfk048u988ep8oil4d.apps.googleusercontent.com",
  SCOPE: "https://www.googleapis.com/auth/drive",

  // フォルダは起動時に名前で検索して解決する。IDはあくまで予備
  ROOT_FOLDER_NAME: "ナミノオト_施工写真",
  ROOT_FOLDER_ID_FALLBACK: "1DuJWlTTfQhsIiU7IsP_bhdLXicmjQpd6",
  JOBS_FOLDER_NAME: "_案件別",
  JOBS_FOLDER_ID_FALLBACK: "1Wrfn3VNY_RM_gFDMQmTLWPq-aNiijsA3",

  // アップロード設定
  MAX_PARALLEL: 3,               // 同時に送る枚数（これ以上は端末が落ちる）
  CHUNK_BYTES: 8 * 256 * 1024,   // 2MB。resumableのチャンクは256KBの倍数であること
  RETRY_MAX: 3,                  // 失敗時の再試行回数（指数バックオフ）

  // 画像変換
  MAX_LONG_EDGE: 2560,           // 長辺の上限px（それ以下なら拡大しない）
  JPEG_QUALITY: 0.9
};

// 工程の定義。key と path は CONTRACTS.md §2 の Step の形
// 「施工中(during)」だけは path の2段目（DayN_YYYYMMDD）を実行時に組み立てる
const STEPS = [
  { key: "pre",    label: "事前資料", fileLabel: "事前資料", path: ["01_事前資料"] },
  { key: "before", label: "着工前",   fileLabel: "着工前",   path: ["02_着工前写真"] },
  { key: "during", label: "施工中",   fileLabel: "施工中",   path: ["03_施工中写真"] }, // + DayN
  { key: "done",   label: "完了",     fileLabel: "完了",     path: ["04_完了写真"] },
  { key: "sns",    label: "SNS素材",  fileLabel: "SNS素材",  path: ["07_SNS_HP素材", "02_ディテール寄り"] }
];

// アプリが「無ければ作ってよい」フォルダ名（これ以外は ensureFolder が拒否する）
const CREATABLE_FOLDERS = [
  "07_SNS_HP素材",
  "01_定点ビフォーアフター",
  "02_ディテール寄り",
  "03_書き出し済み",
  "04_投稿済み"
];
const CREATABLE_DAY_PATTERN = /^Day\d+_\d{8}$/; // DayN_YYYYMMDD

// 案件作成専用。ensureFolder の許可リストには追加しない。
const JOB_SUBFOLDERS = Object.freeze([
  "01_事前資料", "02_着工前写真", "03_施工中写真",
  "04_完了写真", "05_報告書", "06_書類_見積請求"
]);

// 端末記号の割り当て。人が増えたらここに1行足すだけ
const DEVICE_OWNERS = [
  { tag: "M", name: "まぁくん（村上）" },
  { tag: "K", name: "河野さん" },
  { tag: "R", name: "岸本さん" },
  { tag: "X", name: "その他・応援" }
];

return { CONFIG, STEPS, CREATABLE_FOLDERS, CREATABLE_DAY_PATTERN, JOB_SUBFOLDERS, DEVICE_OWNERS };
})();

const __npu_storage = (() => {
const { DEVICE_OWNERS } = __npu_config;

const PREFIX = "npu.";
const memory = new Map();

// キーを名前空間付きに正規化して返す。
function storageKey(key) {
  const text = String(key);
  return text.startsWith(PREFIX) ? text : `${PREFIX}${text}`;
}

// 指定キーの保存値を返す。未保存・破損時は fallback を返す。
function load(key, fallback) {
  const fullKey = storageKey(key);
  let raw = null;
  if (memory.has(fullKey)) {
    try { return JSON.parse(memory.get(fullKey)); } catch (_) { return fallback; }
  }
  try {
    raw = localStorage.getItem(fullKey);
  } catch (_error) {
    raw = memory.has(fullKey) ? memory.get(fullKey) : null;
  }
  if (raw === null) return fallback;
  try {
    return JSON.parse(raw);
  } catch (_error) {
    return fallback;
  }
}

// 指定キーにJSON化できる値を保存し、成否を返す。
function save(key, value) {
  const fullKey = storageKey(key);
  let raw;
  try {
    raw = JSON.stringify(value);
    if (raw === undefined) return false;
  } catch (_error) {
    return false;
  }
  try {
    localStorage.setItem(fullKey, raw);
    memory.delete(fullKey);
    return true;
  } catch (_error) {
    memory.set(fullKey, raw);
    return true;
  }
}

// 指定キーの保存値を削除する。削除不能でも例外を投げない。
function remove(key) {
  const fullKey = storageKey(key);
  memory.delete(fullKey);
  try {
    localStorage.removeItem(fullKey);
  } catch (_error) {
    // メモリ側は削除済みなので何もしない。
  }
}

// 保存済みの端末記号を返す。未設定・不正値なら null を返す。
function getDeviceTag() {
  const tag = load("deviceTag", null);
  return typeof tag === "string" && DEVICE_OWNERS.some((owner) => owner.tag === tag)
    ? tag
    : null;
}

// 端末記号を大文字1文字に正規化して保存し、成否を返す。
function setDeviceTag(tag) {
  const normalized = typeof tag === "string" ? tag.trim().toUpperCase() : "";
  if (normalized.length !== 1 || !DEVICE_OWNERS.some((owner) => owner.tag === normalized)) {
    return false;
  }
  return save("deviceTag", normalized);
}

// 最近使った案件を最大3件、新しい順で返す。
function getRecentJobs() {
  const jobs = load("recentJobs", []);
  if (!Array.isArray(jobs)) return [];
  return jobs.filter((job) => job && typeof job === "object" && typeof job.id === "string").slice(0, 3);
}

// 案件を履歴の先頭へ積み、同じIDを除外して最大3件にする。
function pushRecentJob(job) {
  if (!job || typeof job !== "object" || typeof job.id !== "string" || !job.id) return;
  const recent = [job, ...getRecentJobs().filter((item) => item.id !== job.id)].slice(0, 3);
  save("recentJobs", recent);
}

/** この端末で送信済みの記録を新しい順で返す。画像は保持しない。 */
function getUploadHistory() {
  const records = load("uploadHistory", []);

async function sendChunk(sessionUrl, blob, offset) {

  const token = await ensureToken(); // セッションURLへの送信にもトークンを付ける

    method: "PUT",
    headers: {

  if (res.ok) {
    const json = await res.json();
    return { done: true, nextOffset: blob.size, fileId: json.id };
  }
  if (res.status === 401) {
    notifyAuthLost(token);
    await ensureToken();
    return sendChunk(sessionUrl, blob, offset);
  }
  throw new Error("送信に失敗しました（" + res.status + "）");

// 台帳は案件フォルダ直下に置き、端末をまたいで共有される。

const SPOTS_FILE_NAME = "_定点.json";

/** 新しい空の台帳を作る */
function freshData(site) {
  return {
    meta: { app: "naminooto-photo-upload", version: "1.0", generatedAt: new Date().toISOString() },
    site: site || "",
    spots: []
  };
}

/**
 * 案件の定点台帳を読み込む → { fileId|null, data }
 * 無ければ新規の器を返す（この時点ではDriveに作らない。最初の保存時に作る）。
 * 電波などの取得失敗は throw する（呼び出し側がエラー表示。空の台帳で上書きしないため）。
 * 「中身が壊れたJSON」のときだけ新規の器を返す（写真は消えないので安全側）。
 */
async function loadSpots(job) {
  const found = await findJsonInFolder(job.id, SPOTS_FILE_NAME);
  if (!found) return { fileId: null, data: freshData(job.site) };
  const blob = await downloadFileBlob(found.id);   // 取得失敗はここで throw

    const data = JSON.parse(await blob.text());
    if (!data || !Array.isArray(data.spots)) throw new Error("bad");

    return { fileId: found.id, data: freshData(job.site) };

 * 台帳を保存する → fileId
 * 保存の直前に必ずDriveの最新を取り直して合流（マージ）する。
 * → 2端末が同時に使っても、お互いの定点・撮影結果を消し合わない。
 * → 「無いと思って2個作る」事故も防ぐ（作成前にもう一度探す）。
 */
async function saveSpots(job, fileId, data) {
  data.meta.generatedAt = new Date().toISOString();
  const found = await findJsonInFolder(job.id, SPOTS_FILE_NAME);
  if (found) {
    try {
      const remote = JSON.parse(await (await downloadFileBlob(found.id)).text());
      if (remote && Array.isArray(remote.spots)) {
        data.spots = mergeSpots(remote.spots, data.spots);

 */
function mergeSpots(remoteSpots, localSpots) {
  const map = new Map();
  for (const r of remoteSpots) map.set(r.code, { ...r });
  for (const l of localSpots) {
    const r = map.get(l.code);
    if (!r) { map.set(l.code, { ...l }); continue; }
    map.set(l.code, {
      ...r,
      ...l,
      beforeFileId: l.beforeFileId || r.beforeFileId,
      afterFileId: l.afterFileId || r.afterFileId,

    code: nextSpotCode(data),
    name: String(name || "").trim() || "名称なし",
    how: String(how || "").trim(),
    orientation: null,        // before撮影時に自動判定して入れる
    beforeFileId: null,
    afterFileId: null
  };
  data.spots.push(spot);
  return spot;
}

/** 撮影結果を台帳に反映する（kind: "before" | "after"） */
function setSpotPhoto(data, code, kind, fileId, orientation) {
  const spot = (data.spots || []).find((s) => s.code === code);
  if (!spot) return;
  if (kind === "before") {
    spot.beforeFileId = fileId;
    if (orientation) spot.orientation = orientation;
  } else {
    spot.afterFileId = fileId;
  }
}

/** 定点の進み具合 → "none"（未）| "before"（before済）| "done"（両方済） */
function spotStatus(spot) {
  if (spot.beforeFileId && spot.afterFileId) return "done";
  if (spot.beforeFileId) return "before";
  return "none";
}

return { loadSpots, saveSpots, nextSpotCode, addSpot, setSpotPhoto, spotStatus, SPOTS_FILE_NAME };
})();

const __npu_camera = (() => {

// camera.js — 定点撮影用のライブカメラ制御

/** 実行環境を確認し、背面カメラを利用できる可能性があるか返す。 */
async function isLiveAvailable() {
  try {
    return Boolean(
      typeof navigator !== "undefined"
      && navigator.mediaDevices
      && typeof navigator.mediaDevices.getUserMedia === "function"
    );
  } catch (_) {
    return false;
  }
}

/** video要素と写真の向きを受け取り、背面カメラを開始して停止用オブジェクトを返す。 */
async function startLive(videoEl, orientation) {
  if (!videoEl || !(await isLiveAvailable())) return null;

  let stream = null;
  try {
    const landscape = orientation === "landscape";
    const portrait = orientation === "portrait";
    const video = {
      facingMode: { ideal: "environment" },
      ...(landscape ? { width: { ideal: 1920 }, height: { ideal: 1080 } } : {}),
      ...(portrait ? { width: { ideal: 1080 }, height: { ideal: 1920 } } : {})
    };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    videoEl.srcObject = stream;
    videoEl.setAttribute("playsinline", "");
    videoEl.muted = true;
    await videoEl.play();

    let stopped = false;
    return {
      stop() {
        if (stopped) return;
        stopped = true;
        stream.getTracks().forEach((track) => track.stop());
        if (videoEl.srcObject === stream) videoEl.srcObject = null;
      }
    };
  } catch (_) {
    if (stream) stream.getTracks().forEach((track) => track.stop());
    try { videoEl.srcObject = null; } catch (_) { /* 停止済みなら何もしない。 */ }
    return null;
  }
}

/** 再生中のvideo要素を受け取り、現在のフレームをJPEG Blobとして返す。 */
async function captureFrame(videoEl) {
  try {
    const width = Number(videoEl && videoEl.videoWidth);
    const height = Number(videoEl && videoEl.videoHeight);
    if (!width || !height) return null;

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext("2d", { alpha: false });
    if (!context) return null;
    context.drawImage(videoEl, 0, 0, width, height);

    return await new Promise((resolve) => {
      canvas.toBlob((blob) => resolve(blob || null), "image/jpeg", 0.92);
    });
  } catch (_) {
    return null;
  }
}

return { isLiveAvailable, startLive, captureFrame };
})();

// 並列3・直前採番・チャンク送信・中断からの再開・失敗分の再送・Wake Lock を面倒みる。




let lastPhotos = null;   // retryFailed 用に覚えておく

/** 画面スリープを防ぐ（対応してない端末では何もしない） */

  const two = (n) => String(n).padStart(2, "0");

const reserved = new Map();

/**
 * 1枚ぶんの名前を決める。
 * Driveの既存ファイル＋この端末で予約済みの番号、両方より大きい番号を使う。
 * 一度決めた名前は再試行でも使い回す（呼び出し側が photo.fileName で管理）。
 */
async function decideFileName(photo, target) {
  const dateISO = photo.shotAt || todayLocalISO();
  const ymd = dateISO.replace(/-/g, "");

  const existing = await listFileNames(target.folderId);   // 直前に毎回取り直す

  const localMax = reserved.get(prefix) || 0;
  const seq = Math.max(driveMax, localMax) + 1;

    dateISO,
    site: target.job.site,
    fileLabel: target.step.fileLabel,

 * 1枚アップロード。
 * ・名前は初回だけ採番し、再試行では使い回す（同じ写真の重複保存を防ぐ）
 * ・セッションURLも使い回し、電波断のあとは「どこまで届いたか」を照会して続きから送る
 */
async function uploadOne(photo, target, hooks) {
  photo.status = "uploading";
  hooks.onPhoto(photo);

    const next = await probeResumable(photo.sessionUrl, photo.blob.size);

}

      const folderId = await drive.resolveStepFolderId(s.job, step);
      state.setStep(step);
      state.setTarget(folderId, [s.job.folderName, ...step.path].join(" / "));
      state.goto("photos");
      refreshFolderCount(folderId);
    } catch (e) {
      showError(e);
    }
  },

  /** 施工中：既存のDayフォルダを選んだとき */
  async selectDayFolder(day) {
    const s = state.getState();
    const step = {
      key: "during", label: "施工中",
      fileLabel: "施工中Day" + day.n,
      path: ["03_施工中写真", day.name]
    };
    state.setStep(step);
    state.setTarget(day.id, [s.job.folderName, ...step.path].join(" / "));
    state.goto("photos");
    refreshFolderCount(day.id);
  },

  /** 施工中：「今日の日付で新規作成」 */
  async createTodayDayFolder() {
    const s = state.getState();
    try {
      const days = await drive.listDayFolders(s.job);
      const n = nextDayNumber(days.map((d) => d.name));
      const todayISO = todayLocalISO();
      const name = dayFolderName(n, todayISO);
      const duringId = await drive.resolveStepFolderId(s.job, { path: ["03_施工中写真"] });
      const dayId = await drive.ensureFolder(duringId, name);
      await actions.selectDayFolder({ id: dayId, name, n, dateISO: todayISO });
    } catch (e) {
      showError(e);
    }
  },

  async addFromCamera(fileList) { try { await state.addPhotos(fileList); } catch (e) { showError(e); } },
  async addFromAlbum(fileList) { try { await state.addPhotos(fileList); } catch (e) { showError(e); } },
  removePhoto(id) { state.removePhoto(id); },
  clearPhotos() { state.clearPhotos(); },

  async startUpload() {
    const s = state.getState();
    if (s.uploading || !s.targetFolderId || s.photos.length === 0) return;
    state.setUploading(true);
    state.goto("progress");
    // stateのコピーではなく実体を渡すため、stateモジュール側の配列を使う
    await uploader.uploadAll(
      statePhotosRef(),
      { folderId: s.targetFolderId, folderPath: s.targetPath, job: s.job, step: s.step },
      hooks
    );
  },

  async retryFailed() {
    if (state.getState().uploading) return;
    state.setUploading(true);
    await uploader.retryFailed(hooks);
  },

  openDriveFolder() {
    const s = state.getState();
    if (s.targetFolderId) window.open(drive.folderWebUrl(s.targetFolderId), "_blank");
  },

  back() {
    const s = state.getState();
    if (s.uploading) return;
    if (s.screen === "history") { if (s.historyGroup) state.setHistoryGroup(null); else state.goto("jobs"); return; }
    if (s.screen === "progress") { actions.continuePhotos(); return; }
    if (s.screen === "shoot") { state.setShoot(null); state.goto("spots"); return; }
    if (s.screen === "spots") { state.goto("step"); return; }
    const order = ["login", "jobs", "step", "photos", "progress"];
    const i = order.indexOf(s.screen);
    if (i > 0) state.goto(order[i - 1]);
  },

  getRecentJobs: () => storage.getRecentJobs(),
  getDeviceOwners: () => DEVICE_OWNERS,
  setDeviceTag: (tag) => storage.setDeviceTag(tag),

  // ---- Phase 2：定点ビフォーアフター ----

  /** 工程画面の「📐 定点ビフォーアフター」から */
  async openSpots() {
    const s = state.getState();
    if (!s.job) return;
    state.setSpotsBusy(true);
    state.goto("spots");
    try {
      const loaded = await spots.loadSpots(s.job);
      state.setSpots(loaded.fileId, loaded.data);
    } catch (e) {
      showError(e);
      state.goto("step");
    } finally {
      state.setSpotsBusy(false);
    }
  },

  /** 定点を追加 → そのままbefore撮影へ */
  async addSpot(payload) {
    const s = state.getState();
    if (!s.spotsData || s.spotsBusy) return;
    state.setSpotsBusy(true);
    try {
      // クローン上で追加し、Drive保存が成功してから画面に反映する（失敗時のズレ防止）
      const draft = structuredClone(s.spotsData);
      const spot = spots.addSpot(draft, payload);
      const fileId = await spots.saveSpots(s.job, s.spotsFileId, draft);
      state.setSpots(fileId, draft);
      state.setSpotsBusy(false);
      await actions.shootSpot(spot.code);
    } catch (e) {
      showError(e);
      state.setSpotsBusy(false);
    }
  },

  /** 定点をタップ → 未ならbefore撮影、before済ならafter撮影、両方済なら閲覧へ */
  async shootSpot(code) {
    const s = state.getState();
    if (s.spotsBusy || !s.spotsData) return;   // 読み込み中の誤タップを無効化
    const spot = s.spotsData.spots.find((x) => x.code === code);
    if (!spot) return;
    if (spot.beforeFileId && spot.afterFileId) {
      await actions.viewSpot(code);            // 撮影済みは閲覧画面へ（撮り直しはそこから）
      return;
    }
    await startShoot(spot, spot.beforeFileId ? "after" : "before");
  },

  /** 撮影済みペアを見る（before/afterを並べて表示） */
  async viewSpot(code) {
    const s = state.getState();
    if (s.spotsBusy || !s.spotsData) return;
    const spot = s.spotsData.spots.find((x) => x.code === code);
    if (!spot) return;
    state.setSpotsBusy(true);
    try {
      const [b, a] = await Promise.all([
        spot.beforeFileId ? drive.downloadFileBlob(spot.beforeFileId) : null,
        spot.afterFileId ? drive.downloadFileBlob(spot.afterFileId) : null
      ]);
      state.setSpotView({
        code,
        name: spot.name,
        beforeUrl: b ? URL.createObjectURL(b) : null,
        afterUrl: a ? URL.createObjectURL(a) : null
      });
    } catch (e) {
      showError(e);
    } finally {
      state.setSpotsBusy(false);
    }
  },

  closeView() {
    state.setSpotView(null);
  },

  /** 閲覧画面から撮り直し（before/afterどちらも指定可。古い写真はDriveに残る＝消さない） */
  async retakeSpot(code, kind) {
    const s = state.getState();
    if (s.spotsBusy || !s.spotsData) return;
    const spot = s.spotsData.spots.find((x) => x.code === code);
    if (!spot) return;
    state.setSpotView(null);
    await startShoot(spot, kind);
  },

  /** Driveの定点フォルダをそのまま開く */
  async openSpotsFolder() {
    const s = state.getState();
    if (!s.job) return;
    try {
      const p1 = await drive.ensureFolder(s.job.id, "07_SNS_HP素材");
      const p2 = await drive.ensureFolder(p1, "01_定点ビフォーアフター");
      window.open(drive.folderWebUrl(p2), "_blank");
    } catch (e) {
      showError(e);
    }
  },

  /** 撮影確定：変換 → アップ → 台帳更新 → 一覧へ */
  async spotCaptured(blob) {
    const s = state.getState();
    const shoot = s.shoot;
    if (!shoot || s.spotsBusy) return;
    state.setSpotsBusy(true);
    try {
      // 回転補正・縮小・GPS除去（方式Bのカメラ写真はEXIF付きで来るため必ず通す）
      const conv = await toUploadJpeg(blob, { maxLongEdge: CONFIG.MAX_LONG_EDGE, quality: CONFIG.JPEG_QUALITY });
      const upBlob = conv.converted ? conv.blob : blob;
      const orientation = conv.converted ? (conv.width >= conv.height ? "landscape" : "portrait") : null;
      // 変換できなかった写真は中身に合った拡張子で保存する（.jpgと偽らない）
      let ext = "jpg";
      if (!conv.converted) {
        const t = (blob.type || "").toLowerCase();
        ext = t.includes("heic") || t.includes("heif") ? "heic" : (t.split("/")[1] || "jpg");
        state.showToast("変換できなかったため元の形式のまま保存します");
      }

      // 保存先：07_SNS_HP素材/01_定点ビフォーアフター（無ければ作る）
      const p1 = await drive.ensureFolder(s.job.id, "07_SNS_HP素材");
      const p2 = await drive.ensureFolder(p1, "01_定点ビフォーアフター");

      const ymd = todayLocalISO().replace(/-/g, "");
      const name = `${ymd}_${sanitize(s.job.site)}_${shoot.code}_${shoot.kind}.${ext}`;
      const { fileId, fileName } = await uploader.uploadSingle(upBlob, p2, name, null);
      storage.recordUpload({ jobName: s.job.site, jobId: s.job.id, step: "定点 " + shoot.code + " " + shoot.kind, fileName, sentAt: new Date().toISOString(), fileId, folderId: p2 });

      // クローン上で台帳を更新し、Drive保存が成功してから画面に反映
      const draft = structuredClone(s.spotsData);
      spots.setSpotPhoto(draft, shoot.code, shoot.kind, fileId, orientation);
      const fid = await spots.saveSpots(s.job, s.spotsFileId, draft);
      state.setSpots(fid, draft);
      state.setShoot(null);
      state.goto("spots");
      state.showToast(`✅ ${shoot.code} の ${shoot.kind} を保存しました`);
    } catch (e) {
      showError(e);
    } finally {
      state.setSpotsBusy(false);
    }
  },

  cancelShoot() {
    state.setShoot(null);
    state.goto("spots");
  }
};

// stateモジュール内の photos 実体を取り出す小さな橋渡し
// （uploaderはblobを直接触る必要があるため）
function statePhotosRef() { return state._photosRef(); }

/** 定点撮影を開始する共通処理（afterのときはbeforeを取得して重ねる） */
async function startShoot(spot, kind) {
  let beforeUrl = null;
  if (kind === "after" && spot.beforeFileId) {
    state.setSpotsBusy(true);
    try {
      const blob = await drive.downloadFileBlob(spot.beforeFileId);
      beforeUrl = URL.createObjectURL(blob);
    } catch (e) {
      showError(e);
      state.setSpotsBusy(false);
      return;
    }
    state.setSpotsBusy(false);
  }
  // afterはbeforeを重ねるライブ合成（方式A）を優先。使えない端末は撮影後照合（方式B）
  const live = kind === "after" && (await isLiveAvailable());
  state.setShoot({ code: spot.code, kind, beforeUrl, orientation: spot.orientation, mode: live ? "live" : "photo" });
  state.goto("shoot");
}

// ---- 端末記号の初回選択（名前をタップで選ぶ） ----
function askDeviceTagIfNeeded() {
  return new Promise((resolve) => {
    if (storage.getDeviceTag()) { resolve(); return; }
    const root = document.getElementById("toast-root");
    const box = document.createElement("div");
    box.className = "device-picker";
    box.innerHTML =
      `<div class="device-picker__card">
        <p>この端末を使う人を選んでください</p>
        ${DEVICE_OWNERS.map((o) => `<button class="btn btn--big btn--primary" data-tag="${o.tag}">${o.name}</button>`).join("")}
      </div>`;
    box.addEventListener("click", (e) => {
      const tag = e.target.dataset && e.target.dataset.tag;
      if (tag && storage.setDeviceTag(tag)) {
        box.remove();
        resolve();
      }
    });
    root.appendChild(box);
  });
}

/** 画像数を更新する。通信できなければ表示を外す。 */
async function refreshFolderCount(folderId) {
  if (!folderId) return;
  state.setImageCount(folderId, null);
  try { state.setImageCount(folderId, await drive.countImages(folderId)); }
  catch (_) { state.setImageCount(folderId, ""); }
}
/** 工程の件数を既存フォルダだけから読む。施工中は各Dayも合計する。 */
async function refreshStepCounts(job) {
  if (!job) return;
  await Promise.all(STEPS.map(async step => {
    const key = job.id + ":" + step.key;
    state.setImageCount(key, null);
    try {
      const id = await drive.findStepFolderId(job, step);
      let count = id ? await drive.countImages(id) : 0;
      if (step.key === "during") {
        const days = await drive.listDayFolders(job);
        for (const day of days) {
          const n = await drive.countImages(day.id);
          state.setImageCount(day.id, n); count += n;
        }
      }
      state.setImageCount(key, count);
    } catch (_) { state.setImageCount(key, ""); }
  }));
}

// ---- 起動 ----
async function loadJobs() {
  const jobsFolderId = await drive.resolveJobsFolderId();
  const jobs = await drive.listJobs(jobsFolderId);
  state.setJobs(jobs);
}

function renderLoop() {
  const root = document.getElementById("screens");
  Object.values(SCREENS).forEach((m) => m.mount && m.mount(root, actions));
  const historyButton = document.createElement("button");
  historyButton.className = "btn history-button";
  historyButton.textContent = "履歴";
  historyButton.onclick = actions.openHistory;
  historyButton.hidden = true;
  document.querySelector(".appbar").appendChild(historyButton);
  const authBar = document.createElement("div");
  authBar.className = "auth-bar";
  authBar.setAttribute("role", "status");
  authBar.hidden = true;
  authBar.innerHTML = '<span>ログインの有効期限が切れました</span><button class="btn btn--primary">続ける</button>';
  authBar.querySelector("button").onclick = actions.continueSignIn;
  document.getElementById("app").appendChild(authBar);
  state.subscribe((s) => {
    historyButton.hidden = s.screen !== "jobs";
    authBar.hidden = !s.authRequired;
    authBar.querySelector("button").disabled = s.authBusy;
    authBar.querySelector("button").textContent = s.authBusy ? "確認中…" : "続ける";
    const mod = SCREENS[s.screen];
    if (mod) mod.render(root, s, actions);
    const acct = document.getElementById("acct");
    if (acct) acct.textContent = s.email || "";
  });
}

async function boot() {
  // Service Worker（file:直開きのテスト時はスキップ。sw.jsはHTMLと並べて配置する）
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    try { navigator.serviceWorker.register("./sw.js"); } catch (e) {}
  }
  renderLoop();
  await askDeviceTagIfNeeded();

  try {
    await auth.init();
  } catch (e) {
    state.showToast(e.message);
  }
  auth.setLoginHint(storage.load("lastEmail", null));
  auth.onAuthLost(() => state.setAuthRequired(true));

  // 下書きの復元確認（復元されるのは案件だけ。工程は選び直してもらう）
  const draft = state.loadDraft();
  if (draft && confirm(`前回の案件「${draft.job.site}」の続きから始めますか？`)) {
    state.restoreDraft(draft);
  } else {
    state.clearDraft();
  }

  // 前にログインしたことがある端末なら、ボタンを押させずに静かに自動ログイン
  if (storage.load("lastEmail", null)) {
    state.setLoginBusy(true);
    const silent = await auth.trySilentSignIn();
    state.setLoginBusy(false);
    if (silent && silent.email) {
      state.setEmail(silent.email);
      try {
        await loadJobs();
        state.goto(state.getState().job ? "step" : "jobs");
        if (state.getState().job) refreshStepCounts(state.getState().job);
        return;
      } catch (e) {
        showError(e);
      }
    }
  }
  if (!state.getState().email) state.goto("login");
}

boot();

return {  };
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ナミノオト 現場写真</title>

<meta name="theme-color" content="#16233d">

<meta name="apple-mobile-web-app-title" content="現場写真">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- __STYLE__ ← ビルド時に style.css がここに入る -->
<style>
/* style.css — ナミノオト現場写真 v1.1「キリッと」デザイン（担当：Claude に交代）
   パレット：ロゴの紺（顔）／赤茶（アクセント）／和紙ベージュ（背景）
   方針：白カード＋細い罫線＋締まった角＋強弱のある文字。現場で押しやすい大きさは維持 */

:root {
  --c-navy: #16233d;        /* ロゴの紺。ヘッダー・見出し・文字 */
  --c-navy-soft: #223354;   /* 紺の明るめ（押した時など） */
  --c-primary: #c8553d;     /* 赤茶。主ボタン・アクセント */
  --c-primary-deep: #a94430;
  --c-bg: #f5f1ea;          /* 和紙ベージュ */
  --c-card: #fffdf9;        /* カードの白 */
  --c-line: #d8d0c4;        /* 罫線 */
  --c-ink: #2b2b2b;         /* 本文 */
  --c-ink-weak: #6f6a61;    /* 補足文字 */
  --c-ok: #3f7d5a;
  --c-ng: #b03a2e;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(22, 35, 61, 0.08), 0 4px 14px rgba(22, 35, 61, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
  background: var(--c-bg);
  color: var(--c-ink);
  line-height: 1.55;
  min-height: 100dvh;
}

#app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ---- ヘッダー：紺の帯にロゴ ---- */
.appbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--c-navy);
  color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  box-shadow: 0 2px 8px rgba(22, 35, 61, 0.25);
}
.appbar__brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 16px; letter-spacing: 0.06em;
  white-space: nowrap;
}
.appbar__logo {
  width: 26px; height: 26px; border-radius: 6px; display: block;
}
.appbar__sub {
  font-size: 11px; font-weight: 500; letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.72);
  border-left: 1px solid rgba(255, 255, 255, 0.3);
  padding-left: 8px; margin-left: 2px;
}
.acct {
  font-size: 11px; color: rgba(255, 255, 255, 0.75);
  max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---- 画面の器 ---- */
#screens { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; }

.screen { display: none; }
.screen--active { display: block; animation: rise 0.18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.screen__head { margin: 8px 0 16px; }
.screen__head h1 {
  font-size: 22px; font-weight: 800; color: var(--c-navy);
  letter-spacing: 0.02em; line-height: 1.3;
}
.screen__head h2 { font-size: 15px; color: var(--c-navy); margin-top: 16px; }
.muted { color: var(--c-ink-weak); font-size: 13px; margin-top: 4px; }

.section-title {
  font-size: 12px; font-weight: 700; color: var(--c-ink-weak);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin: 18px 0 8px;
}
.divider { border: none; border-top: 1px solid var(--c-line); margin: 16px 0; }
.empty { color: var(--c-ink-weak); font-size: 13px; padding: 12px 2px; }

/* ---- ボタン ---- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 46px;
  border: 1px solid transparent; border-radius: var(--radius);
  font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.03em;
  cursor: pointer;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.06s ease, filter 0.12s ease;
  margin-top: 10px;
}
.btn:active { transform: scale(0.985); }
.btn--big { min-height: 58px; font-size: 16px; }
.btn--primary {
  background: var(--c-primary); color: #fff;
  box-shadow: 0 2px 6px rgba(200, 85, 61, 0.32);
}
.btn--primary:active { background: var(--c-primary-deep); }
.btn--ghost {
  background: transparent; color: var(--c-ink-weak);
  border-color: var(--c-line); font-weight: 600;
}
.btn:disabled { opacity: 0.45; pointer-events: none; box-shadow: none; }

/* 工程ボタンだけは「白カード＋紺文字」。赤の壁にしない（data-step-keyで判別） */
.btn[data-step-key] {
  background: var(--c-card); color: var(--c-navy);
  border: 1px solid var(--c-line);
  box-shadow: var(--shadow);
  justify-content: flex-start; padding: 0 18px;
  position: relative;
}
.btn[data-step-key]::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px;
  border-radius: 0 4px 4px 0; background: var(--c-primary);
}
.btn[data-step-key]::after {
  content: "›"; margin-left: auto; color: var(--c-line);
  font-size: 22px; font-weight: 400;
}

/* ---- リスト（案件・Day） ---- */
.list-stack { display: flex; flex-direction: column; gap: 8px; }
.list-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; min-height: 56px;
  background: var(--c-card); color: var(--c-ink);
  border: 1px solid var(--c-line); border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 14px;
  font-family: inherit; font-size: 15px; text-align: left;
  cursor: pointer;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.list-row:active { background: #f8f3ea; }
.list-row > span[aria-hidden] { color: var(--c-line); font-size: 22px; }
.row-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row-main strong { color: var(--c-navy); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main small { color: var(--c-ink-weak); font-size: 12px; }

/* ---- 検索 ---- */
input[type="search"] {
  width: 100%; min-height: 46px;
  background: var(--c-card);
  border: 1px solid var(--c-line); border-radius: var(--radius);
  padding: 0 14px;
  font-family: inherit; font-size: 15px; color: var(--c-ink);
  outline: none;
  -webkit-appearance: none; appearance: none;
}
input[type="search"]:focus { border-color: var(--c-navy); box-shadow: 0 0 0 3px rgba(22, 35, 61, 0.12); }
input[type="search"]::placeholder { color: var(--c-ink-weak); }

/* ---- アップ先の表示 ---- */
.pathbar {
  display: block;
  background: rgba(22, 35, 61, 0.06);
  border: 1px solid var(--c-line); border-radius: 8px;
  color: var(--c-navy); font-size: 12px; font-weight: 600;
  padding: 8px 10px; margin-top: 8px;
  word-break: break-all;
}

/* ---- 写真選択 ---- */
.file-input { display: none; }
.photo-summary {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 16px 0 8px;
}
.photo-summary strong { color: var(--c-navy); font-size: 14px; }
.photo-summary .btn { width: auto; min-height: 38px; margin: 0; padding: 0 14px; font-size: 13px; }

.thumb-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px;
  margin: 8px 0 4px;
}
.thumb {
  position: relative; aspect-ratio: 1;
  border-radius: 8px; overflow: hidden;
  background: var(--c-card); border: 1px solid var(--c-line);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb__placeholder {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; font-size: 24px; color: var(--c-ok);
}
.thumb__del {
  position: absolute; top: 4px; right: 4px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(22, 35, 61, 0.82); color: #fff;
  border: none; font-size: 15px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}

/* ---- 進捗 ---- */
.progress-row { margin: 12px 0; }
.progress-row__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  font-size: 13px; margin-bottom: 5px;
}
.progress-row__head .row-main { color: var(--c-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress-row__head strong { color: var(--c-navy); font-size: 15px; white-space: nowrap; }

.bar {
  height: 8px; border-radius: 999px; overflow: hidden;
  background: rgba(22, 35, 61, 0.10);
}
.bar__fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--c-primary), var(--c-primary-deep));
  transition: width 0.25s ease;
}

.status-success { color: var(--c-ok); }
.status-error { color: var(--c-ng); font-weight: 600; }

.badge {
  display: inline-flex; align-items: center;
  background: var(--c-primary); color: #fff;
  border-radius: 999px; padding: 1px 9px;
  font-size: 11px; font-weight: 700;
}

/* ---- トースト（通知） ---- */
#toast-root { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 100; pointer-events: none; }
.toast {
  width: fit-content; max-width: 88%;
  margin: 0 auto;
  background: var(--c-navy); color: #fff;
  border-radius: 999px;
  padding: 11px 20px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(22, 35, 61, 0.35);
  animation: rise 0.2s ease-out;
}

/* ---- くるくる ---- */
.spinner {
  width: 22px; height: 22px;
  border: 3px solid rgba(22, 35, 61, 0.15); border-top-color: var(--c-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 端末の使う人選択（初回だけの全画面） ---- */
.device-picker {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(22, 35, 61, 0.55);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.device-picker__card {
  width: 100%; max-width: 360px;
  background: var(--c-card);
  border-radius: 14px;
  padding: 22px 20px;
  box-shadow: 0 12px 40px rgba(22, 35, 61, 0.4);
}
.device-picker__card p {
  font-size: 15px; font-weight: 700; color: var(--c-navy);
  text-align: center; margin-bottom: 6px;
}

/* ---- Phase 2：定点ビフォーアフター ---- */

/* 工程画面の入口ボタン（紺の縁取りで「素材づくり」感を出す） */
.spots-entry {
  background: var(--c-card); color: var(--c-navy);
  border: 1.5px solid var(--c-navy);
  box-shadow: var(--shadow);
}
.spots-entry:active { background: rgba(22, 35, 61, 0.06); }

/* 定点一覧 */
.spots__list { margin-bottom: 4px; }
.spots__status {
  flex-shrink: 0;
  font-size: 12px; font-weight: 700; color: var(--c-navy);
  background: rgba(22, 35, 61, 0.07);
  border-radius: 999px; padding: 4px 10px;
  white-space: nowrap;
}

/* 定点の追加フォーム */
.spots__add {
  background: var(--c-card);
  border: 1px solid var(--c-line); border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 14px; margin-top: 10px;
}
.spots__label {
  display: block;
  font-size: 12px; font-weight: 700; color: var(--c-ink-weak);
  margin-bottom: 10px;
}
.spots__input {
  display: block; width: 100%; min-height: 46px;
  margin-top: 4px;
  background: #fff;
  border: 1px solid var(--c-line); border-radius: 8px;
  padding: 0 12px;
  font-family: inherit; font-size: 15px; color: var(--c-ink);
  outline: none;
  -webkit-appearance: none; appearance: none;
}
.spots__input:focus { border-color: var(--c-navy); box-shadow: 0 0 0 3px rgba(22, 35, 61, 0.12); }
.spots__error { font-size: 13px; margin: 2px 0 6px; }

/* 撮影画面：映像・写真とbeforeの重ね合わせ */
.shoot__stage {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-height: 62vh;
  background: #0d1524;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 6px;
}
.shoot__media {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;        /* 枠はbefore写真の縦横に合わせるので、coverでピッタリ埋めて位置を合わせる */
  display: block;
}
.shoot__overlay {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
}
.shoot__opacity {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 600; color: var(--c-navy);
  margin: 8px 0 2px;
}
.shoot__opacity input[type="range"] { flex: 1; accent-color: var(--c-primary); min-height: 44px; }
.shoot__shutter { background: var(--c-navy); box-shadow: 0 2px 6px rgba(22, 35, 61, 0.35); }
.shoot__shutter:active { background: var(--c-navy-soft); }

/* 撮影済みペアの閲覧パネル */
.spots__viewer {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(22, 35, 61, 0.55);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  overflow-y: auto;
}
.spots__viewer-card {
  width: 100%; max-width: 420px;
  background: var(--c-card);
  border-radius: 14px;
  padding: 16px 16px 18px;
  box-shadow: 0 12px 40px rgba(22, 35, 61, 0.4);
}
.spots__viewer-title {
  font-size: 16px; font-weight: 800; color: var(--c-navy);
  text-align: center; margin-bottom: 10px;
}
.spots__figure { margin: 0 0 10px; }
.spots__figure figcaption {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--c-ink-weak); margin-bottom: 3px; text-transform: uppercase;
}
.spots__figure img {
  display: block; width: 100%; max-height: 34vh;
  object-fit: contain;
  background: #0d1524;
  border-radius: 8px;
}

</style>
</head>

<div id="app">
  <!-- 画面は ui-*.js が描く。ここには器だけ置く -->
  <header class="appbar">
    <span class="appbar__brand"><img class="appbar__logo" src="icon-192.png" alt="">ナミノオト<span class="appbar__sub">現場写真</span></span>
    <span class="acct" id="acct"></span>
  </header>
  <main id="screens"></main>
  <div id="toast-root"></div>
</div>
<!-- __SCRIPT__ ← ビルド時に結合済みJSがここに入る -->
<script type="module">
const __npu_config = (() => {

// config.js — 設定値の唯一の置き場（担当：Claude）
// 秘密情報はクライアントIDのみ（公開前提の値）。他の秘密は絶対に書かない。

const CONFIG = {
  // Google Cloud で作った OAuth クライアントID をここに貼る（READMEの手順3）
  CLIENT_ID: "1049961337664-8g46qfb3a5oq8irfk048u988ep8oil4d.apps.googleusercontent.com",
  SCOPE: "https://www.googleapis.com/auth/drive",

  // フォルダは起動時に名前で検索して解決する。IDはあくまで予備
  ROOT_FOLDER_NAME: "ナミノオト_施工写真",
  ROOT_FOLDER_ID_FALLBACK: "1DuJWlTTfQhsIiU7IsP_bhdLXicmjQpd6",
  JOBS_FOLDER_NAME: "_案件別",
  JOBS_FOLDER_ID_FALLBACK: "1Wrfn3VNY_RM_gFDMQmTLWPq-aNiijsA3",

  // アップロード設定
  MAX_PARALLEL: 3,               // 同時に送る枚数（これ以上は端末が落ちる）
  CHUNK_BYTES: 8 * 256 * 1024,   // 2MB。resumableのチャンクは256KBの倍数であること
  RETRY_MAX: 3,                  // 失敗時の再試行回数（指数バックオフ）

  // 画像変換
  MAX_LONG_EDGE: 2560,           // 長辺の上限px（それ以下なら拡大しない）
  JPEG_QUALITY: 0.9
};

// 工程の定義。key と path は CONTRACTS.md §2 の Step の形
// 「施工中(during)」だけは path の2段目（DayN_YYYYMMDD）を実行時に組み立てる
const STEPS = [
  { key: "pre",    label: "事前資料", fileLabel: "事前資料", path: ["01_事前資料"] },
  { key: "before", label: "着工前",   fileLabel: "着工前",   path: ["02_着工前写真"] },
  { key: "during", label: "施工中",   fileLabel: "施工中",   path: ["03_施工中写真"] }, // + DayN
  { key: "done",   label: "完了",     fileLabel: "完了",     path: ["04_完了写真"] },
  { key: "sns",    label: "SNS素材",  fileLabel: "SNS素材",  path: ["07_SNS_HP素材", "02_ディテール寄り"] }
];

// アプリが「無ければ作ってよい」フォルダ名（これ以外は ensureFolder が拒否する）
const CREATABLE_FOLDERS = [
  "07_SNS_HP素材",
  "01_定点ビフォーアフター",
  "02_ディテール寄り",
  "03_書き出し済み",
  "04_投稿済み"
];
const CREATABLE_DAY_PATTERN = /^Day\d+_\d{8}$/; // DayN_YYYYMMDD

// 端末記号の割り当て。人が増えたらここに1行足すだけ
const DEVICE_OWNERS = [
  { tag: "M", name: "まぁくん（村上）" },
  { tag: "K", name: "河野さん" },
  { tag: "R", name: "岸本さん" },
  { tag: "X", name: "その他・応援" }
];

return { CONFIG, STEPS, CREATABLE_FOLDERS, CREATABLE_DAY_PATTERN, DEVICE_OWNERS };
})();

const __npu_storage = (() => {
const { DEVICE_OWNERS } = __npu_config;

const PREFIX = "npu.";
const memory = new Map();

// キーを名前空間付きに正規化して返す。
function storageKey(key) {
  const text = String(key);
  return text.startsWith(PREFIX) ? text : `${PREFIX}${text}`;
}

// 指定キーの保存値を返す。未保存・破損時は fallback を返す。
function load(key, fallback) {
  const fullKey = storageKey(key);
  let raw = null;
  try {
    raw = localStorage.getItem(fullKey);
  } catch (_error) {
    raw = memory.has(fullKey) ? memory.get(fullKey) : null;
  }
  if (raw === null) return fallback;
  try {
    return JSON.parse(raw);
  } catch (_error) {
    return fallback;
  }
}

// 指定キーにJSON化できる値を保存し、成否を返す。
function save(key, value) {
  const fullKey = storageKey(key);
  let raw;
  try {
    raw = JSON.stringify(value);
    if (raw === undefined) return false;
  } catch (_error) {
    return false;
  }
  try {
    localStorage.setItem(fullKey, raw);
    memory.delete(fullKey);
    return true;
  } catch (_error) {
    memory.set(fullKey, raw);
    return true;
  }
}

// 指定キーの保存値を削除する。削除不能でも例外を投げない。
function remove(key) {
  const fullKey = storageKey(key);
  memory.delete(fullKey);
  try {
    localStorage.removeItem(fullKey);
  } catch (_error) {
    // メモリ側は削除済みなので何もしない。
  }
}

// 保存済みの端末記号を返す。未設定・不正値なら null を返す。
function getDeviceTag() {
  const tag = load("deviceTag", null);
  return typeof tag === "string" && DEVICE_OWNERS.some((owner) => owner.tag === tag)
    ? tag
    : null;
}

// 端末記号を大文字1文字に正規化して保存し、成否を返す。
function setDeviceTag(tag) {
  const normalized = typeof tag === "string" ? tag.trim().toUpperCase() : "";
  if (normalized.length !== 1 || !DEVICE_OWNERS.some((owner) => owner.tag === normalized)) {
    return false;
  }
  return save("deviceTag", normalized);
}

async function init() {
  await waitForGis();
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPE,
    callback: () => {}       // 実際のcallbackは要求ごとに差し替える
  });

  return new Promise((resolve, reject) => {
    let tries = 0;
    const timer = setInterval(() => {
      if (window.google && google.accounts && google.accounts.oauth2) {
        clearInterval(timer);
        resolve();
      } else if (++tries > 100) { // 10秒待ってダメなら諦める

      accessToken = resp.access_token;

async function isLiveAvailable() {
  try {
    return Boolean(
      typeof navigator !== "undefined"
      && navigator.mediaDevices
      && typeof navigator.mediaDevices.getUserMedia === "function"
    );
  } catch (_) {
    return false;
  }
}

/** video要素と写真の向きを受け取り、背面カメラを開始して停止用オブジェクトを返す。 */
async function startLive(videoEl, orientation) {
  if (!videoEl || !(await isLiveAvailable())) return null;

  let stream = null;
  try {
    const landscape = orientation === "landscape";
    const portrait = orientation === "portrait";
    const video = {
      facingMode: { ideal: "environment" },
      ...(landscape ? { width: { ideal: 1920 }, height: { ideal: 1080 } } : {}),
      ...(portrait ? { width: { ideal: 1080 }, height: { ideal: 1920 } } : {})
    };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    videoEl.srcObject = stream;
    videoEl.setAttribute("playsinline", "");
    videoEl.muted = true;
    await videoEl.play();

    let stopped = false;
    return {
      stop() {
        if (stopped) return;
        stopped = true;
        stream.getTracks().forEach((track) => track.stop());
        if (videoEl.srcObject === stream) videoEl.srcObject = null;
      }
    };
  } catch (_) {
    if (stream) stream.getTracks().forEach((track) => track.stop());
    try { videoEl.srcObject = null; } catch (_) { /* 停止済みなら何もしない。 */ }
    return null;
  }
}

/** 再生中のvideo要素を受け取り、現在のフレームをJPEG Blobとして返す。 */
async function captureFrame(videoEl) {
  try {
    const width = Number(videoEl && videoEl.videoWidth);
    const height = Number(videoEl && videoEl.videoHeight);
    if (!width || !height) return null;

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext("2d", { alpha: false });
    if (!context) return null;
    context.drawImage(videoEl, 0, 0, width, height);

    return await new Promise((resolve) => {
      canvas.toBlob((blob) => resolve(blob || null), "image/jpeg", 0.92);
    });
  } catch (_) {
    return null;
  }
}

return { isLiveAvailable, startLive, captureFrame };
})();

const __npu_uploader = (() => {
const { CONFIG } = __npu_config;
const { listFileNames, startResumable, sendChunk, probeResumable, folderWebUrl, findJsonInFolder } = __npu_drive;
const { maxSequence, buildFileName } = __npu_naming;
const { getDeviceTag } = __npu_storage;
// uploader.js — アップロードの司令塔（担当：Claude）
// 並列3・直前採番・チャンク送信・中断からの再開・失敗分の再送・Wake Lock を面倒みる。




let lastPhotos = null;   // retryFailed 用に覚えておく
let lastTarget = null;
let wakeLock = null;

/** 画面スリープを防ぐ（対応してない端末では何もしない） */
async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { /* 非対応・省電力モードなどは無視 */ }
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** 端末の時計での今日（日本で使うので端末ローカル＝JST。UTCだと朝9時まで前日になる） */
function todayLocalISO() {
  const d = new Date();
  const two = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}`;
}

/** 同じ端末内での連番の取り合いを防ぐ予約表（prefix → 予約済み最大番号） */
const reserved = new Map();

/**
 * 1枚ぶんの名前を決める。
 * Driveの既存ファイル＋この端末で予約済みの番号、両方より大きい番号を使う。
 * 一度決めた名前は再試行でも使い回す（呼び出し側が photo.fileName で管理）。
 */
async function decideFileName(photo, target) {
  const dateISO = photo.shotAt || todayLocalISO();
  const ymd = dateISO.replace(/-/g, "");
  const prefix = `${ymd}_${target.job.site}_${target.step.fileLabel}`;

  const existing = await listFileNames(target.folderId);   // 直前に毎回取り直す
  const driveMax = maxSequence(existing, prefix);
  const localMax = reserved.get(prefix) || 0;
  const seq = Math.max(driveMax, localMax) + 1;
  reserved.set(prefix, seq);

  return buildFileName({
    dateISO,
    site: target.job.site,
    fileLabel: target.step.fileLabel,
    seq,
    deviceTag: getDeviceTag() || "X",
    ext: photo.ext || "jpg"
  });
}

/**
 * 1枚アップロード。
 * ・名前は初回だけ採番し、再試行では使い回す（同じ写真の重複保存を防ぐ）
 * ・セッションURLも使い回し、電波断のあとは「どこまで届いたか」を照会して続きから送る
 */
async function uploadOne(photo, target, hooks) {
  photo.status = "uploading";
  hooks.onPhoto(photo);

  if (!photo.fileName) photo.fileName = await decideFileName(photo, target);

  let offset = 0;
  if (photo.sessionUrl) {
    // 前回の続きがあるか照会。-1なら実は届き切っていた（応答だけ落ちたケース）
    const next = await probeResumable(photo.sessionUrl, photo.blob.size);
    if (next === -1) {
      photo.status = "done";
      photo.progress = 100;
      hooks.onPhoto(photo);
      return;
    }
    offset = next;
  } else {
    const { sessionUrl } = await startResumable(target.folderId, photo.fileName, photo.blob);
    photo.sessionUrl = sessionUrl;
  }

  while (offset < photo.blob.size) {
    const r = await sendChunk(photo.sessionUrl, photo.blob, offset);
    if (!r.done && r.nextOffset <= offset) {
      throw new Error("送信が進みませんでした"); // 再試行（バックオフ）に回す
    }
    offset = r.nextOffset;
    photo.progress = Math.round((offset / photo.blob.size) * 100);
    hooks.onPhoto(photo);
    if (r.done) {
      photo.driveFileId = r.fileId;
      photo.status = "done";
      photo.progress = 100;
      hooks.onPhoto(photo);
      return;
    }
  }
}

/** 指数バックオフ付きで1枚を最大 RETRY_MAX 回試す */
async function uploadWithRetry(photo, target, hooks) {
  for (let attempt = 0; attempt <= CONFIG.RETRY_MAX; attempt++) {
    try {
      await uploadOne(photo, target, hooks);
      return true;
    } catch (e) {
      if (e.message === "auth") throw e;   // 認証切れは全体を止める
      // セッション自体が死んでいたら作り直す（名前は同じなので重複しない）
      if (String(e.message).includes("再開の確認")) photo.sessionUrl = null;
      if (attempt === CONFIG.RETRY_MAX) {
        photo.status = "error";
        photo.error = "電波が不安定で送れませんでした。再送を押してください。";
        hooks.onPhoto(photo);
        return false;
      }
      await sleep(1000 * Math.pow(2, attempt)); // 1秒→2秒→4秒
    }
  }
}

/**
 * 全部アップロードする。
 * target = { folderId, folderPath, job, step }
 * hooks  = { onPhoto(photo), onOverall(done,total), onFinish(result) }
 * ログイン切れのときは result.authLost = true で返す（写真はwaitingに戻すので再開できる）
 */
async function uploadAll(photos, target, hooks) {
  lastPhotos = photos;
  lastTarget = target;
  const queue = photos.filter((p) => p.status === "waiting" || p.status === "error");
  const total = queue.length;
  let done = 0;
  let failed = 0;

  await acquireWakeLock();
  let authLost = false;   // どれか1本でも認証切れになったら、全ワーカーが静かに止まる
  try {
    // 並列ワーカー方式：MAX_PARALLEL 本のワーカーがキューから取っていく
    const workers = [];
    const iter = queue.values();
    for (let i = 0; i < Math.min(CONFIG.MAX_PARALLEL, total); i++) {
      workers.push((async () => {
        for (const photo of iter) {
          if (authLost) break;
          try {
            const ok = await uploadWithRetry(photo, target, hooks);
            if (ok) done++; else failed++;
          } catch (e) {
            if (e.message === "auth") { authLost = true; break; }
            throw e;
          }
          hooks.onOverall(done, total);
        }
      })());
    }
    // 全ワーカーが止まりきるのを待ってから後処理する（途中で画面や状態を触られないように）
    await Promise.all(workers);
  } finally {
    releaseWakeLock();
  }

  if (authLost) {
    // 途中の写真はwaitingに戻し、再ログイン後に続きからやり直せる状態で返す
    queue.forEach((p) => {
      if (p.status === "uploading") { p.status = "waiting"; hooks.onPhoto(p); }
    });
    hooks.onFinish({ done, failed, total, folderUrl: folderWebUrl(target.folderId), authLost: true });
    return;
  }

  hooks.onFinish({
    done,
    failed,
    total,
    folderUrl: folderWebUrl(target.folderId),
    authLost: false
  });
}

/**
 * 定点写真など「1枚だけ・名前指定」のアップロード → { fileId, fileName }
 * 同名が既にあれば _2, _3 …と枝番を付けて絶対に上書きしない。
 * 電波断に強いよう、通常アップと同じチャンク方式＋3回再試行。
 */
async function uploadSingle(blob, folderId, fileName, onProgress) {
  const existing = await listFileNames(folderId);
  let finalName = fileName;
  if (existing.includes(finalName)) {
    const dot = fileName.lastIndexOf(".");
    const base = dot > 0 ? fileName.slice(0, dot) : fileName;
    const ext = dot > 0 ? fileName.slice(dot) : "";
    let n = 2;
    while (existing.includes(`${base}_${n}${ext}`)) n++;
    finalName = `${base}_${n}${ext}`;
  }

  await acquireWakeLock();
  try {
    // セッションは1回だけ作り、再試行では「どこまで届いたか」を照会して続きから送る。
    // → 完了の応答だけ落ちた場合も、同じ写真を二重に作らない
    let sessionUrl = null;
    let lastError = null;
    for (let attempt = 0; attempt <= CONFIG.RETRY_MAX; attempt++) {
      try {
        let offset = 0;
        if (sessionUrl) {
          const next = await probeResumable(sessionUrl, blob.size);
          if (next === -1) {
            // 実は届き切っていた。IDを名前で引き直して返す
            const found = await findJsonInFolder(folderId, finalName);
            return { fileId: found ? found.id : null, fileName: finalName };
          }
          offset = next;
        } else {
          ({ sessionUrl } = await startResumable(folderId, finalName, blob));
        }
        while (offset < blob.size) {
          const r = await sendChunk(sessionUrl, blob, offset);
          if (!r.done && r.nextOffset <= offset) throw new Error("送信が進みませんでした");
          offset = r.nextOffset;
          if (onProgress) onProgress(Math.round((offset / blob.size) * 100));
          if (r.done) return { fileId: r.fileId, fileName: finalName };
        }
      } catch (e) {
        if (e.message === "auth") throw e;
        if (String(e.message).includes("再開の確認")) sessionUrl = null; // セッション自体が死んでいたら作り直し
        lastError = e;
        if (attempt < CONFIG.RETRY_MAX) await sleep(1000 * Math.pow(2, attempt));
      }
    }
    throw lastError || new Error("アップロードに失敗しました");
  } finally {
    releaseWakeLock();
  }
}

/** 失敗した写真だけもう一度 */
async function retryFailed(hooks) {
  if (!lastPhotos || !lastTarget) return;
  const failedPhotos = lastPhotos.filter((p) => p.status === "error");
  failedPhotos.forEach((p) => { p.status = "waiting"; p.error = null; p.progress = 0; });
  await uploadAll(lastPhotos, lastTarget, hooks);
}

return { uploadAll, uploadSingle, retryFailed };
})();

/** 任意の値を受け取り、HTML表示用の安全な文字列を返す。 */

const __npu_ui_jobs = (() => {

  section.dataset.screen = "jobs";
  section.addEventListener("input", (event) => {

    section.dataset.query = event.target.value;
    filterRows(section, event.target.value);
  });

    if (button) actions.selectJob(section._jobsById.get(button.dataset.jobId));
  });

}

  mount(root, actions);
  root.querySelectorAll(".screen").forEach((screen) => screen.classList.remove("screen--active"));
  const section = root.querySelector('[data-screen="jobs"]');
  section.classList.add("screen--active");
  const query = section.dataset.query || "";
  const all = [...(state.jobs || [])].sort((a, b) => String(b.folderName || b.dateISO || "").localeCompare(String(a.folderName || a.dateISO || ""), "ja"));
  const recent = (actions.getRecentJobs ? actions.getRecentJobs() : []).slice(0, 3);

/** 検索文字を受け取り、一致しない案件行を隠す。 */
function filterRows(section, query) {
  const needle = String(query || "").trim().toLocaleLowerCase("ja");
  section.querySelectorAll("[data-job-id]").forEach((row) => { row.hidden = needle && !row.dataset.search.includes(needle); });

/** 通知文を受け取り、共通の通知欄を更新する。 */

/** 任意の値を受け取り、HTML表示用の安全な文字列を返す。 */
function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]); }
/** 任意の値を受け取り、HTML属性用の安全な文字列を返す。 */
function escapeAttr(value) { return escapeHtml(value); }

return { mount, render };
})();

function confirmPhoto(section, actions) {
  const button = section.querySelector('[data-action="confirm-photo"]');
  if (!button || button.disabled || section._submitting || !section._pendingBlob) return;
  button.disabled = true;
  section._submitting = true;
  const blob = section._pendingBlob;
  releasePreview(section);
  actions.spotCaptured(blob);
}

/** 現在の確認画像を破棄し、再び端末カメラを開く。 */
function retake(section) {
  if (section._submitting) return;
  releasePreview(section);
  section.querySelector('[data-role="photo-stage"]').hidden = true;
  section.querySelector('[data-role="photo-controls"]').hidden = true;
  const open = section.querySelector('[data-action="open-camera"]');
  open.hidden = false;
  open.click();
}

/** スライダー値を受け取り、before重ね画像の透明度を更新する。 */
function updateOverlay(section, value) {
  const opacity = Math.max(0, Math.min(70, Number(value) || 0)) / 100;
  section.querySelectorAll('[data-role="before-overlay"]').forEach((image) => { image.style.opacity = String(opacity); });
}

/** 動作中のカメラを停止し、videoとの接続を解放する。 */
function stopCamera(section) {
  if (section._cameraSession) section._cameraSession.stop();
  section._cameraSession = null;
}

/** 撮影後プレビューのObjectURLとBlob参照を解放する。 */
function releasePreview(section) {
  if (section._previewUrl) URL.revokeObjectURL(section._previewUrl);
  section._previewUrl = null;
  section._pendingBlob = null;
}

/** 撮影画面のカメラ・プレビュー・連打防止状態をすべて片付ける。 */
function cleanUp(section) {
  section._operationId = Number(section._operationId || 0) + 1;
  stopCamera(section);
  releasePreview(section);
  section._submitting = false;
}

/** 通知文を受け取り、共通の通知欄を更新する。 */
function renderToast(message) { const root = document.getElementById("toast-root"); if (root) root.innerHTML = message ? `<div class="toast" role="status">${escapeHtml(message)}</div>` : ""; }
/** 任意の値を受け取り、HTML表示用の安全な文字列を返す。 */
function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]); }
/** 任意の値を受け取り、HTML属性用の安全な文字列を返す。 */
function escapeAttr(value) { return escapeHtml(value); }

return { mount, render };

const __npu_main = (() => {
const storage = __npu_storage;

// main.js — 起動して全部つなぐ（担当：Claude）


const SCREENS = {

// ---- uploaderのhook（進捗をstateへ流す） ----
const hooks = {

      state.goto("login");

      state.showToast(`✅ ${result.done}枚アップ完了`);
      state.clearDraft();

/**
 * エラーの見せ方を1箇所に集約。
 * 認証切れ（"auth"）は onAuthLost 側が画面遷移とトーストを出すので、ここでは何も出さない。
 */
function showError(e) {
  if (e && e.message !== "auth") state.showToast(e.message || "エラーが起きました");
}

/** 端末の時計での今日（日本で使うので端末ローカル＝JST） */
function todayLocalISO() {
  const d = new Date();
  const two = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}`;
}

// ---- UIに渡すactions（CONTRACTS.md §3-10〜14） ----
const actions = {
  async signIn() {
    try {
      const { email } = await auth.signIn();
      state.setEmail(email);
      storage.save("lastEmail", email);   // 次回から自動ログインを試すための目印
      await loadJobs();
      // 起動時に「前回の続きから」を選んでいた場合は、案件選択を飛ばして工程選択へ
      state.goto(state.getState().job ? "step" : "jobs");
    } catch (e) {
      state.showToast("ログインできませんでした。もう一度お試しください。");
    }
  },

  selectJob(job) {
    state.setJob(job);
    storage.pushRecentJob(job);
    state.goto("step");
  },

  async selectStep(stepKey) {
    const def = STEPS.find((s) => s.key === stepKey);
    if (!def) return;
    const s = state.getState();
    try {
      if (def.key === "during") {
        // 施工中はまずDayN一覧を出す（選択 or 新規作成はui-stepの中で）
        const days = await drive.listDayFolders(s.job);
        state.setDayFolders(days);
        return; // 画面はそのまま。ui-stepがDay選択UIを出す
      }
      const step = { ...def };
      const folderId = await drive.resolveStepFolderId(s.job, step);
      state.setStep(step);
      state.setTarget(folderId, [s.job.folderName, ...step.path].join(" / "));
      state.goto("photos");
    } catch (e) {
      showError(e);
    }
  },

  /** 施工中：既存のDayフォルダを選んだとき */
  async selectDayFolder(day) {
    const s = state.getState();
    const step = {
      key: "during", label: "施工中",
      fileLabel: "施工中Day" + day.n,
      path: ["03_施工中写真", day.name]
    };
    state.setStep(step);
    state.setTarget(day.id, [s.job.folderName, ...step.path].join(" / "));
    state.goto("photos");
  },

  /** 施工中：「今日の日付で新規作成」 */
  async createTodayDayFolder() {
    const s = state.getState();
    try {
      const days = await drive.listDayFolders(s.job);
      const n = nextDayNumber(days.map((d) => d.name));
      const todayISO = todayLocalISO();
      const name = dayFolderName(n, todayISO);
      const duringId = await drive.resolveStepFolderId(s.job, { path: ["03_施工中写真"] });
      const dayId = await drive.ensureFolder(duringId, name);
      await actions.selectDayFolder({ id: dayId, name, n, dateISO: todayISO });
    } catch (e) {
      showError(e);
    }
  },

  async addFromCamera(fileList) { try { await state.addPhotos(fileList); } catch (e) { showError(e); } },
  async addFromAlbum(fileList) { try { await state.addPhotos(fileList); } catch (e) { showError(e); } },
  removePhoto(id) { state.removePhoto(id); },
  clearPhotos() { state.clearPhotos(); },

  async startUpload() {
    const s = state.getState();
    if (!s.targetFolderId || s.photos.length === 0) return;
    state.setUploading(true);
    state.goto("progress");
    // stateのコピーではなく実体を渡すため、stateモジュール側の配列を使う
    await uploader.uploadAll(
      statePhotosRef(),
      { folderId: s.targetFolderId, folderPath: s.targetPath, job: s.job, step: s.step },
      hooks
    );
  },

  async retryFailed() {
    state.setUploading(true);
    await uploader.retryFailed(hooks);
  },

  openDriveFolder() {
    const s = state.getState();
    if (s.targetFolderId) window.open(drive.folderWebUrl(s.targetFolderId), "_blank");
  },

  back() {
    const s = state.getState();
    if (s.uploading) return;
    if (s.screen === "shoot") { state.setShoot(null); state.goto("spots"); return; }
    if (s.screen === "spots") { state.goto("step"); return; }
    const order = ["login", "jobs", "step", "photos", "progress"];
    const i = order.indexOf(s.screen);
    if (i > 0) state.goto(order[i - 1]);
  },

  getRecentJobs: () => storage.getRecentJobs(),
  getDeviceOwners: () => DEVICE_OWNERS,
  setDeviceTag: (tag) => storage.setDeviceTag(tag),

  // ---- Phase 2：定点ビフォーアフター ----

  /** 工程画面の「📐 定点ビフォーアフター」から */
  async openSpots() {

    if (!s.job) return;
    state.setSpotsBusy(true);
    state.goto("spots");
    try {
      const loaded = await spots.loadSpots(s.job);
      state.setSpots(loaded.fileId, loaded.data);

  },

  /** 定点を追加 → そのままbefore撮影へ */

    state.setSpotsBusy(true);
    try {
      // クローン上で追加し、Drive保存が成功してから画面に反映する（失敗時のズレ防止）
      const draft = structuredClone(s.spotsData);

  async shootSpot(code) {
    const s = state.getState();

    const spot = s.spotsData.spots.find((x) => x.code === code);
    if (!spot) return;
    if (spot.beforeFileId && spot.afterFileId) {
      await actions.viewSpot(code);            // 撮影済みは閲覧画面へ（撮り直しはそこから）
      return;
    }

  async viewSpot(code) {
    const s = state.getState();
    if (s.spotsBusy || !s.spotsData) return;
    const spot = s.spotsData.spots.find((x) => x.code === code);
    if (!spot) return;
    state.setSpotsBusy(true);
    try {
      const [b, a] = await Promise.all([
        spot.beforeFileId ? drive.downloadFileBlob(spot.beforeFileId) : null,
        spot.afterFileId ? drive.downloadFileBlob(spot.afterFileId) : null
      ]);
      state.setSpotView({
        code,
        name: spot.name,
        beforeUrl: b ? URL.createObjectURL(b) : null,
        afterUrl: a ? URL.createObjectURL(a) : null
      });
    } catch (e) {
      showError(e);
    } finally {
      state.setSpotsBusy(false);
    }

    state.setSpotView(null);
    await startShoot(spot, kind);
  },

  async openSpotsFolder() {
    const s = state.getState();
    if (!s.job) return;
    try {
      const p1 = await drive.ensureFolder(s.job.id, "07_SNS_HP素材");
      const p2 = await drive.ensureFolder(p1, "01_定点ビフォーアフター");

    } catch (e) {
      showError(e);
    }
  },

  /** 撮影確定：変換 → アップ → 台帳更新 → 一覧へ */
  async spotCaptured(blob) {
    const s = state.getState();
    const shoot = s.shoot;
    if (!shoot || s.spotsBusy) return;
    state.setSpotsBusy(true);
    try {
      // 回転補正・縮小・GPS除去（方式Bのカメラ写真はEXIF付きで来るため必ず通す）
      const conv = await toUploadJpeg(blob, { maxLongEdge: CONFIG.MAX_LONG_EDGE, quality: CONFIG.JPEG_QUALITY });
      const upBlob = conv.converted ? conv.blob : blob;
      const orientation = conv.converted ? (conv.width >= conv.height ? "landscape" : "portrait") : null;
      // 変換できなかった写真は中身に合った拡張子で保存する（.jpgと偽らない）
      let ext = "jpg";
      if (!conv.converted) {
        const t = (blob.type || "").toLowerCase();
        ext = t.includes("heic") || t.includes("heif") ? "heic" : (t.split("/")[1] || "jpg");
        state.showToast("変換できなかったため元の形式のまま保存します");
      }

      // 保存先：07_SNS_HP素材/01_定点ビフォーアフター（無ければ作る）
      const p1 = await drive.ensureFolder(s.job.id, "07_SNS_HP素材");
      const p2 = await drive.ensureFolder(p1, "01_定点ビフォーアフター");

      const ymd = todayLocalISO().replace(/-/g, "");
      const name = `${ymd}_${sanitize(s.job.site)}_${shoot.code}_${shoot.kind}.${ext}`;
      const { fileId } = await uploader.uploadSingle(upBlob, p2, name, null);

      // クローン上で台帳を更新し、Drive保存が成功してから画面に反映
      const draft = structuredClone(s.spotsData);
      spots.setSpotPhoto(draft, shoot.code, shoot.kind, fileId, orientation);
      const fid = await spots.saveSpots(s.job, s.spotsFileId, draft);
      state.setSpots(fid, draft);
      state.setShoot(null);
      state.goto("spots");
      state.showToast(`✅ ${shoot.code} の ${shoot.kind} を保存しました`);
    } catch (e) {
      showError(e);
    } finally {
      state.setSpotsBusy(false);
    }
  },

  cancelShoot() {
    state.setShoot(null);
    state.goto("spots");
  }

// stateモジュール内の photos 実体を取り出す小さな橋渡し
// （uploaderはblobを直接触る必要があるため）
function statePhotosRef() { return state._photosRef(); }

/** 定点撮影を開始する共通処理（afterのときはbeforeを取得して重ねる） */
async function startShoot(spot, kind) {
  let beforeUrl = null;
  if (kind === "after" && spot.beforeFileId) {
    state.setSpotsBusy(true);
    try {
      const blob = await drive.downloadFileBlob(spot.beforeFileId);
      beforeUrl = URL.createObjectURL(blob);
    } catch (e) {
      showError(e);
      state.setSpotsBusy(false);
      return;
    }
    state.setSpotsBusy(false);
  }
  // afterはbeforeを重ねるライブ合成（方式A）を優先。使えない端末は撮影後照合（方式B）
  const live = kind === "after" && (await isLiveAvailable());
  state.setShoot({ code: spot.code, kind, beforeUrl, orientation: spot.orientation, mode: live ? "live" : "photo" });
  state.goto("shoot");
}

// ---- 端末記号の初回選択（名前をタップで選ぶ） ----
function askDeviceTagIfNeeded() {
  return new Promise((resolve) => {
    if (storage.getDeviceTag()) { resolve(); return; }
    const root = document.getElementById("toast-root");
    const box = document.createElement("div");
    box.className = "device-picker";
    box.innerHTML =
      `<div class="device-picker__card">
        <p>この端末を使う人を選んでください</p>
        ${DEVICE_OWNERS.map((o) => `<button class="btn btn--big btn--primary" data-tag="${o.tag}">${o.name}</button>`).join("")}
      </div>`;
    box.addEventListener("click", (e) => {
      const tag = e.target.dataset && e.target.dataset.tag;
      if (tag && storage.setDeviceTag(tag)) {
        box.remove();
        resolve();
      }
    });
    root.appendChild(box);
  });
}

// ---- 起動 ----
async function loadJobs() {
  const jobsFolderId = await drive.resolveJobsFolderId();
  const jobs = await drive.listJobs(jobsFolderId);
  state.setJobs(jobs);
}

function renderLoop() {
  const root = document.getElementById("screens");
  Object.values(SCREENS).forEach((m) => m.mount && m.mount(root, actions));
  state.subscribe((s) => {
    const mod = SCREENS[s.screen];
    if (mod) mod.render(root, s, actions);
    const acct = document.getElementById("acct");
    if (acct) acct.textContent = s.email || "";
  });
}

async function boot() {
  // Service Worker（file:直開きのテスト時はスキップ。sw.jsはHTMLと並べて配置する）
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    try { navigator.serviceWorker.register("./sw.js"); } catch (e) {}
  }
  renderLoop();
  await askDeviceTagIfNeeded();

  try {
    await auth.init();
  } catch (e) {
    state.showToast(e.message);
  }
  auth.onAuthLost(() => {
    state.setUploading(false);
    state.showToast("ログインが切れました。もう一度ログインしてください。");
    state.goto("login");
  });

  // 下書きの復元確認（復元されるのは案件だけ。工程は選び直してもらう）
  const draft = state.loadDraft();
  if (draft && confirm(`前回の案件「${draft.job.site}」の続きから始めますか？`)) {
    state.restoreDraft(draft);
  } else {
    state.clearDraft();
  }

  // 前にログインしたことがある端末なら、ボタンを押させずに静かに自動ログイン
  if (storage.load("lastEmail", null)) {
    const silent = await auth.trySilentSignIn();
    if (silent && silent.email) {
      state.setEmail(silent.email);
      try {
        await loadJobs();
        state.goto(state.getState().job ? "step" : "jobs");
        return;
      } catch (e) {
        showError(e);
      }
    }
  }
  state.goto("login");
}

boot();

return {  };
})();
